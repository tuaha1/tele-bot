services:
  - type: web
    name: whatsapp-reminder-bot
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Asia/Kolkata
      - key: WHATSAPP_PHONE_NUMBER
        sync: false
    healthCheckPath: /health
    autoDeploy: true
